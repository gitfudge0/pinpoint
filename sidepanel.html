<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Pinpoint</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FAF9F5;
    --surface: #FFFFFF;
    --text: #191919;
    --text-secondary: #6B6A66;
    --border: #E8E6DF;
    --danger: #B91C1C;
    --accent: #D97757;
    --accent-hover: #C4633F;
    --on-accent: #FFFFFF;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1F1E1D;
      --surface: #2A2928;
      --text: #FAF9F5;
      --text-secondary: #A8A69F;
      --border: #3A3937;
      --danger: #F08C7C;
    }
  }
  *:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  body {
    margin: 0;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  #status {
    padding: 8px 12px;
    color: var(--danger);
    display: none;
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }
  .fbp-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: none;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .fbp-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .fbp-item-label {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
  }
  .fbp-item-delete {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: var(--radius);
  }
  .fbp-item-delete:hover { color: var(--danger); }
  .fbp-item-text, .fbp-item-comment {
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .fbp-item-text { color: var(--text-secondary); font-style: italic; }
  #empty {
    color: var(--text-secondary);
    padding: 12px 0;
    text-align: center;
  }
  footer {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }
  button.fbp-action {
    flex: 1;
    padding: 8px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    cursor: pointer;
    font: inherit;
    font-weight: 600;
  }
  #copy-btn {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
    border-radius: var(--radius);
  }
  #copy-btn:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }
  #clear-btn {
    background: transparent;
    color: var(--text-secondary);
    border-color: var(--border);
  }
  #clear-btn:hover {
    color: var(--danger);
    background: var(--surface);
    border-color: var(--danger);
  }
  #fallback {
    display: block;
    width: calc(100% - 24px);
    box-sizing: border-box;
    margin: 0 12px 12px;
    min-height: 100px;
    font: inherit;
    padding: 8px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    resize: vertical;
  }
</style>
</head>
<body>
  <header>Pinpoint</header>
  <div id="status">Can't annotate this page.</div>
  <div id="list">
    <div id="empty">No annotations yet. Click the toolbar icon to start picking.</div>
  </div>
  <textarea id="fallback" style="display:none" readonly></textarea>
  <footer>
    <button id="copy-btn" class="fbp-action">Copy</button>
    <button id="clear-btn" class="fbp-action">Clear all</button>
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
