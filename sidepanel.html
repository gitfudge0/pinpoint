<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Pinpoint</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/inter-var.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  :root {
    color-scheme: light dark;
    --bg: #FAF9F5;
    --surface: #FFFFFF;
    --text: #191919;
    --text-secondary: #6B6A66;
    --border: #E8E6DF;
    --danger: #B91C1C;
    --accent: #D97757;
    --accent-hover: #C4633F;
    --on-accent: #FFFFFF;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1F1E1D;
      --surface: #2A2928;
      --text: #FAF9F5;
      --text-secondary: #A8A69F;
      --border: #3A3937;
      --danger: #F08C7C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1F1E1D;
    --surface: #2A2928;
    --text: #FAF9F5;
    --text-secondary: #A8A69F;
    --border: #3A3937;
    --danger: #F08C7C;
  }
  *:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  body {
    margin: 0;
    font: 13px/1.5 "Inter", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  #status {
    padding: 8px 12px;
    color: var(--danger);
    display: none;
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }
  .fbp-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: none;
    padding: 8px 10px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .fbp-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .fbp-item-label {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
  }
  .fbp-item-delete {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: var(--radius);
  }
  .fbp-item-delete:hover { color: var(--danger); }
  .fbp-item-text, .fbp-item-comment {
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .fbp-item-text { color: var(--text-secondary); font-style: italic; }
  .fbp-subitem-list {
    margin-top: 4px;
    padding-left: 10px;
    border-left: 2px solid var(--border);
  }
  .fbp-subitem {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
    margin-top: 4px;
  }
  .fbp-subitem-comment {
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }
  .fbp-subitem-delete {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 11px;
    line-height: 1;
    padding: 1px 3px;
    border-radius: var(--radius);
    flex-shrink: 0;
  }
  .fbp-subitem-delete:hover { color: var(--danger); }
  #empty {
    color: var(--text-secondary);
    padding: 12px 0;
    text-align: center;
  }
  footer {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }
  button.fbp-action {
    flex: 1;
    padding: 8px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
  }
  #copy-btn {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
    border-radius: var(--radius);
  }
  #copy-btn:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }
  #clear-btn {
    background: transparent;
    color: var(--text-secondary);
    border-color: var(--border);
  }
  #clear-btn:hover {
    color: var(--danger);
    background: var(--surface);
    border-color: var(--danger);
  }
  #settings-btn {
    margin-left: auto;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    border-radius: var(--radius);
  }
  #settings-btn:hover, #settings-btn.active {
    color: var(--text);
    background: var(--surface);
  }
  #settings {
    display: none;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  #settings.open { display: block; }
  .fbp-settings-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .fbp-segmented {
    display: flex;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 12px;
  }
  .fbp-segmented button {
    flex: 1;
    padding: 6px 4px;
    border: none;
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    border-left: 1px solid var(--border);
  }
  .fbp-segmented button:first-child { border-left: none; }
  .fbp-segmented button.active {
    background: var(--accent);
    color: var(--on-accent);
  }
  #coffee-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 12px;
  }
  #coffee-link:hover {
    color: var(--text);
    background: var(--surface);
    border-color: var(--accent);
  }
  #fallback {
    display: block;
    width: calc(100% - 24px);
    box-sizing: border-box;
    margin: 0 12px 12px;
    min-height: 100px;
    font: inherit;
    padding: 8px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    resize: vertical;
  }
</style>
</head>
<body>
  <header style="display:flex;align-items:center;gap:6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="2" style="flex-shrink:0"><circle cx="12" cy="12" r="7"/><line x1="12" y1="1" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="1" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="23" y2="12"/></svg>Pinpoint
    <button id="settings-btn" title="Settings" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <div id="settings">
    <div class="fbp-settings-label">Theme</div>
    <div class="fbp-segmented" id="theme-toggle">
      <button data-theme-value="system" type="button">System</button>
      <button data-theme-value="light" type="button">Light</button>
      <button data-theme-value="dark" type="button">Dark</button>
    </div>
    <a id="coffee-link" href="https://buymeacoffee.com/gitfudge" target="_blank" rel="noopener">☕ Buy me a coffee</a>
  </div>
  <div id="status">Can't annotate this page.</div>
  <div id="list">
    <div id="empty">No annotations yet. Click the toolbar icon to start picking.</div>
  </div>
  <textarea id="fallback" style="display:none" readonly></textarea>
  <footer>
    <button id="copy-btn" class="fbp-action">Copy</button>
    <button id="clear-btn" class="fbp-action">Clear all</button>
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
