<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Pinpoint</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/inter-var.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  :root {
    color-scheme: light dark;
    --bg: #F7F7F8;
    --surface: #FFFFFF;
    --text: #3F4650;
    --text-strong: #1F2430;
    --text-secondary: #9AA0AA;
    --label: #6B7280;
    --border: #E4E5E9;
    --rule: #EDEEF1;
    --hover: #F2F3F5;
    --input: #FFFFFF;
    --danger: #DC2626;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --ring: rgba(37, 99, 235, 0.15);
    --on-accent: #FFFFFF;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 20px rgba(15, 23, 42, 0.08);
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --radius: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191B1F;
      --surface: #22252A;
      --text: #E7E9EC;
      --text-strong: #E7E9EC;
      --text-secondary: #8C929C;
      --label: #8C929C;
      --border: #33373E;
      --rule: #33373E;
      --hover: #2A2E34;
      --input: #191B1F;
      --danger: #F87171;
      --ring: rgba(59, 130, 246, 0.25);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.45);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #191B1F;
    --surface: #22252A;
    --text: #E7E9EC;
    --text-strong: #E7E9EC;
    --text-secondary: #8C929C;
    --label: #8C929C;
    --border: #33373E;
    --rule: #33373E;
    --hover: #2A2E34;
    --input: #191B1F;
    --danger: #F87171;
    --ring: rgba(59, 130, 246, 0.25);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.45);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  }
  *:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-strong);
    letter-spacing: 0.01em;
  }
  header svg { flex-shrink: 0; }
  #status {
    margin: 0 16px 10px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    color: var(--danger);
    font-weight: 500;
    display: none;
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 16px 12px;
  }
  .fbp-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: box-shadow 120ms ease, border-color 120ms ease;
  }
  .fbp-item:hover {
    box-shadow: var(--shadow);
  }
  .fbp-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .fbp-item-label {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--label);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm);
    padding: 3px 8px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fbp-item-delete {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--label);
    line-height: 1;
    padding: 5px;
    border-radius: var(--radius-sm);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .fbp-item-delete:hover { color: var(--danger); background: var(--hover); }
  .fbp-item-text, .fbp-item-comment {
    margin-top: 10px;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .fbp-item-text { color: var(--text-secondary); }
  .fbp-item-comment { color: var(--text); }
  .fbp-subitem-list {
    margin-top: 10px;
    padding-left: 12px;
    border-left: 2px solid var(--rule);
  }
  .fbp-subitem {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-top: 6px;
  }
  .fbp-subitem-comment {
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
  }
  .fbp-subitem-delete {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--label);
    line-height: 1;
    padding: 4px;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
  }
  .fbp-subitem-delete:hover { color: var(--danger); background: var(--hover); }
  #empty {
    color: var(--text-secondary);
    padding: 48px 24px;
    text-align: center;
    line-height: 1.6;
  }
  #empty svg {
    display: block;
    margin: 0 auto 12px;
    color: var(--text-secondary);
  }
  footer {
    display: flex;
    gap: 8px;
    padding: 12px 16px 16px;
  }
  button.fbp-action {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
  }
  #copy-btn {
    background: var(--accent);
    color: var(--on-accent);
    border-color: transparent;
  }
  #copy-btn:hover {
    background: var(--accent-hover);
  }
  #clear-btn {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
  }
  #clear-btn:hover {
    background: var(--hover);
    color: var(--danger);
  }
  #settings-btn {
    margin-left: auto;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--label);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    border-radius: var(--radius-sm);
  }
  #settings-btn:hover, #settings-btn.active {
    color: var(--text);
    background: var(--hover);
  }
  #settings {
    display: none;
    margin: 0 16px 12px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  #settings.open { display: block; }
  body.settings-open #status,
  body.settings-open #list,
  body.settings-open #fallback,
  body.settings-open footer { display: none !important; }
  body.settings-open #settings {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  #settings #coffee-link { margin-top: auto; }
  .fbp-settings-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--label);
    margin-bottom: 10px;
  }
  .fbp-segmented {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 14px;
  }
  .fbp-segmented button {
    flex: 1;
    padding: 7px 4px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--label);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius-sm);
  }
  .fbp-segmented button:hover { color: var(--text); background: var(--hover); }
  .fbp-segmented button.active {
    background: var(--hover);
    color: var(--text);
    border-color: var(--border);
    box-shadow: inset 0 0 0 1px var(--border);
  }
  #pin-color {
    height: 36px;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    margin-bottom: 14px;
  }
  #pin-color::-webkit-color-swatch-wrapper { padding: 4px; }
  #pin-color::-webkit-color-swatch { border: none; border-radius: 5px; }
  .fbp-checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 0;
    cursor: pointer;
  }
  .fbp-checkbox-row:last-of-type { margin-bottom: 14px; }
  .fbp-checkbox-row input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
    margin: 0;
  }
  #version-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-secondary);
    font-size: 12px;
    border-top: 1px solid var(--rule);
    padding-top: 12px;
    margin-top: 14px;
  }
  #version-info a {
    color: var(--text-secondary);
    text-decoration: none;
  }
  #version-info a:hover { color: var(--text); text-decoration: underline; }
  #coffee-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    box-sizing: border-box;
    gap: 8px;
    padding: 10px 16px;
    background: #FFDD00;
    border: none;
    border-radius: var(--radius-sm);
    color: #0D0C22;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  #coffee-link:hover {
    background: #FFEA00;
    box-shadow: var(--shadow);
  }
  #fallback {
    display: block;
    width: calc(100% - 32px);
    box-sizing: border-box;
    margin: 0 16px 12px;
    min-height: 100px;
    font: inherit;
    font-size: 14px;
    padding: 12px;
    background: var(--input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    resize: vertical;
  }
  #fallback:focus {
    outline: none;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 3px var(--ring);
  }
</style>
</head>
<body>
  <header><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>Pinpoint
    <button id="settings-btn" title="Settings" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <div id="settings">
    <div class="fbp-settings-label">Theme</div>
    <div class="fbp-segmented" id="theme-toggle">
      <button data-theme-value="system" type="button">System</button>
      <button data-theme-value="light" type="button">Light</button>
      <button data-theme-value="dark" type="button">Dark</button>
    </div>
    <div class="fbp-settings-label">Copy format</div>
    <div class="fbp-segmented" id="format-toggle">
      <button data-format-value="markdown" type="button">Markdown</button>
      <button data-format-value="plain" type="button">Plain text</button>
      <button data-format-value="json" type="button">JSON</button>
    </div>
    <div class="fbp-settings-label">Pin color</div>
    <input type="color" id="pin-color" value="#2563EB" />
    <div class="fbp-settings-label">Copy content</div>
    <label class="fbp-checkbox-row"><input type="checkbox" id="include-selector" /> Include selector</label>
    <label class="fbp-checkbox-row"><input type="checkbox" id="include-text" /> Include text snippet</label>
    <a id="coffee-link" href="https://buymeacoffee.com/gitfudge" target="_blank" rel="noopener">☕ Buy me a coffee</a>
    <div id="version-info"><span id="version-text"></span><a href="https://gitfudge.dev" target="_blank" rel="noopener">gitfudge.dev</a></div>
  </div>
  <div id="status">Can't annotate this page.</div>
  <div id="list">
    <div id="empty"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>No annotations yet. Click the toolbar icon to start picking.</div>
  </div>
  <textarea id="fallback" style="display:none" readonly></textarea>
  <footer>
    <button id="copy-btn" class="fbp-action">Copy</button>
    <button id="clear-btn" class="fbp-action">Clear all</button>
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
